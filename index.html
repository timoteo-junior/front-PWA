<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f5c45">
    <title>Cadastro de Usuários</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Cadastro de Usuários</h1>
        <p>Gerencie os usuários cadastrados no sistema</p>
      </div>
    </header>

    <main class="container">
      <section class="painel">
        <h2 id="titulo-formulario">Novo usuário</h2>

        <!-- No formulário -->
        <form id="form-servico">
            <input type="hidden" id="servico-id">
            <input type="text" id="nome" placeholder="Nome do Serviço" required>
            <input type="text" id="descricao" placeholder="Descrição do Serviço" required>
            <input type="number" id="valor" placeholder="Valor" required>
            <button type="submit">Guardar</button>
        </form>

        <!-- Na tabela -->
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="lista-servicos"></tbody>
        </table>
      </section>

      <section class="painel">
        <div class="cabecalho-lista">
          <h2>Usuários</h2>
          <button type="button" id="botao-atualizar" class="secundario">Atualizar lista</button>
        </div>

        <form id="form-busca" class="busca">
          <label for="busca-id">Buscar usuário pelo ID</label>
          <div class="linha-busca">
            <input id="busca-id" type="text" placeholder="Informe o ID do usuário">
            <button type="submit">Buscar</button>
            <button type="button" id="botao-limpar-busca" class="secundario">Listar todos</button>
          </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>
        <div id="lista-usuarios" class="lista-usuarios"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
