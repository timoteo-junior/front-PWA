<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f5c45">
    <title>Cadastro de Filmes</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Cadastro de Filmes</h1>
        <p>Gerencie os filmes cadastrados no sistema</p>
      </div>
    </header>

    <main class="container">
      <section class="painel">
        <h2 id="titulo-formulario">Novo filme</h2>

        <form id="form-filme">
          <input type="hidden" id="filme-id">

          <label for="titulo">Título</label>
          <input id="titulo" name="titulo" type="text" required>

          <label for="diretor">Diretor</label>
          <input id="diretor" name="diretor" type="text" required>

          <label for="dataLancamento">Data de Lançamento</label>
          <input id="dataLancamento" name="dataLancamento" type="date" required>

          <label for="genero">Gênero</label>
          <input id="genero" name="genero" type="text" required>

          <div class="acoes-formulario">
            <button type="submit" id="botao-salvar">Cadastrar</button>
            <button type="button" id="botao-cancelar" class="secundario oculto">
              Cancelar edição
            </button>
          </div>
        </form>
      </section>

      <section class="painel">
        <div class="cabecalho-lista">
          <h2>Filmes</h2>
          <button type="button" id="botao-atualizar" class="secundario">Atualizar lista</button>
        </div>

        <form id="form-busca" class="busca">
          <label for="busca-id">Buscar Filme pelo ID</label>
          <div class="linha-busca">
            <input id="busca-id" type="text" placeholder="Informe o ID do filme">
            <button type="submit">Buscar</button>
            <button type="button" id="botao-limpar-busca" class="secundario">Listar todos</button>
          </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>
        <div id="lista-filmes" class="lista-usuarios"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
